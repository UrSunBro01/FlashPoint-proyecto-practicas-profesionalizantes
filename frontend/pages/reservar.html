    <head>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="../css/fuentes.css">
        <link rel="stylesheet" href="../css/mobile.css" media="(max-width: 767px)">
        <script src="../js/script.js" defer></script>
    </head>
    <body>
        <div id="top"></div><!-- un ancla,para evitar javascript-->
        <header>
            <a href="../index.html" class="logo-link">
                <picture>
                    <source media="(max-width: 650px)" srcset="../iconos/iconosinletra.svg">
                    <img src="../iconos/iconovector.svg" alt="Logo de GrooveSpace" class="logo-image">
                </picture>
            </a>
            <p class="subtitulo">Trabajo práctico · Leopoldo Marechal</p>
            <button id="toggle-dark" class="btn-dark">🌙</button>
        </header>

        <nav>
            <ul>
                <li><a href="../pages/registrarse.html">registrarse</a></li>
                <li><a href="../pages/iniciosesion.html" id="nav-login">iniciar sesión</a></li>
                <li><a href="../pages/consultar.html">disponibilidad de salas</a></li>
                <!-- esta ultima debe aparecer despues de login/singin-->
                <li><a href="../pages/reservar.html">reservar sala</a></li>
                <li><a href="../pages/micuenta.html">mi cuenta</a></li>
            </ul>
        </nav>

        <main>
            <section class="form-container">
                <h1>reservas:</h1>
                    <!-- formulario de registro -->
                <form action="registrado.html" method="get" id="formReservar">
                    <!-- lista deslizante de sala -->
                    <label for="sala">Elegí tu sala:</label>
                    <select  id="sala" name="sala" required>
                        <option value="">-- Seleccioná una opción --</option>
                        <option value="standard">Sala Standard</option>
                        <option value="premium">Sala Premium</option>
                        <option value="bateria">Sala de Batería</option>
                    </select>
                    <br>
                    <!-- fecha-->
                    <label for="fecha">Fecha del ensayo:</label>
                    <input type="date" id="fecha" name="fecha"  required>
                    <!-- hora -->
                    <label for="horario">Horario de inicio:</label>
                    <input type="time" id="horario" name="horario" required>
                    <!-- turnos de 2hs mínimo: falta validar con JS/backend a futuro -->

                    <!-- terminos y condiciones-->
                    <div class="options-group">
                    <input type="checkbox" id="equipamiento" value="aceptar"><!-- input no necesita cerrarse,es tipo void -->
                    <label for="equipamiento" >agregar equipamiento
                        <strong>ATENCION:</strong>puede agregar costo extra
                    </label>
                    </div>
                    <div class="options-group">
                    <input type="checkbox" id="terminos" value="aceptar" required><!-- input no necesita cerrarse,es tipo void -->
                    <label for="terminos" >Acepto las reglas de convivencia</label>
                    </div>
                    
                    
                    <!-- botón de envío -->
                    <input type="submit" class="btn" value="Reservar">
                    <a href="../index.html" class="btn">volver al inicio</a>
                </form>
                
            </section>
        </main>
        <footer>
            <p>GrooveSpace - Tu lugar, tu música</p>
            <a href="sobrenosotros.html">sobre nosotros</a>
        </footer>
