
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

            <picture>
                <source media="(max-width: 650px)" srcset="../iconos/iconosinletra.svg">
                <img src="../iconos/iconovector.svg" alt="Logo de GrooveSpace" class="logo-image">
            </picture>
        </a>

        <p class="subtitulo">Trabajo práctico · Leopoldo Marechal</p>

        <button id="toggle-dark" class="btn-dark">🌙</button>
    </header>

    <nav>
        <ul>
            <li>
                <a href="../pages/registrarse.html" id="nav-register">
                    registrarse

            </li>

                <a href="../pages/iniciosesion.html" id="nav-login">
                    iniciar sesión

            </li>

            <li>
                <a href="../pages/consultar.html">

                <a href="../pages/reservar.html">

            <li>

                </a>
            </li>
        </ul>
    </nav>

    <main>
        <section class="form-container">
            <h1>Registro de usuario</h1>

            <form action="#" method="post" id="form-registro">

                <label for="nombre">Nombre:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresá tu nombre"
                    minlength="2"
                    maxlength="50"
                    required
                >

                <label for="apellido">Apellido:</label>
                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Ingresá tu apellido"
                    minlength="2"
                    maxlength="50"
                    required
                >

                <label for="usuario">Nombre de usuario:</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Elegí un nombre de usuario"
                    minlength="3"
                    maxlength="20"
                    pattern="[a-zA-Z0-9_]{3,20}"
                    title="Debe contener entre 3 y 20 caracteres. Solo se permiten letras, números y guion bajo."
                    required
                >

                <label for="email">Correo electrónico:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Tu correo electrónico"
                    maxlength="100"
                    required
                >

                <label for="password">Contraseña:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Creá una contraseña"
                    minlength="8"
                    maxlength="64"
                    title="La contraseña debe tener al menos 8 caracteres."
                    required
                >

                <label for="confirm_password">Confirmar contraseña:</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Volvé a ingresar tu contraseña"
                    minlength="8"
                    maxlength="64"
                    required
                >

                <div class="options-group">
                    <input
                        type="checkbox"
                        id="terminos"
                        name="terminos"
                        value="aceptar"
                        required
                    >

                    <label for="terminos">
                        Acepto los términos y condiciones de uso
                    </label>
                </div>

                <input
                    type="submit"
                    class="btn btn-secundario btn-chico"
                    value="Registrarse"
                >

                <a href="../index.html" class="btn btn-secundario btn-chico">
                    Volver al inicio
                </a>

                <a href="iniciosesion.html" class="btn btn-secundario btn-chico">
                    ¿Ya estás registrado? ¡Iniciá sesión!
                </a>

            </form>
        </section>
    </main>

    <footer>
        <p>GrooveSpace - Tu lugar, tu música</p>
