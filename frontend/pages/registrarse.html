        <main>
            <section class="form-container">
                <h1>registro de usuario:</h1>

                    <!-- formulario de registro -->
                    <!-- hagamos de cuenta que safa -->
                <form action="registrado.html" method="get" id="form-registro">
                
                    <!-- usuario-->
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" placeholder="nombre de usuario" minlength="4" maxlength="15"  required>
                
                <!-- email-->
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="tu correo electrónico" required>
                <!-- telefono-->
                
                <label for="phone">telefono:</label>
                <input type="tel" id="phone" name="phone" placeholder="tu número de teléfono sin cod de área" required>
                
                <!-- contraseña pide entre 4 y 15 caracteres -->
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="tu contraseña" minlength="4" maxlength="15" pattern="^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{4,15}$" title="Debe contener al menos una mayúscula y un número, entre 4 y 15 caracteres" required>
                
                <label for="confirm_password">Confirmar contraseña:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="confirma tu contraseña" minlength="4" maxlength="15" pattern="^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{4,15}$" title="Debe contener al menos una mayúscula y un número, entre 4 y 15 caracteres" required>

                <label for="cumpleaños">Fecha de nacimiento:</label>
                <input type="date" id="cumpleaños" name="cumpleaños"  required>

                <label for="banda">posee banda? :</label>
                <input type="text" id="banda" name="banda" placeholder="ingrese nombre de su banda(sino deje el campo en blanco)">
                
                <div class="options-group">
                <input type="checkbox" id="terminos" value="aceptar" required><!-- input no necesita cerrarse,es tipo void -->
                <label for="terminos" >Acepto los términos y condiciones de uso</label>
                </div>
                
                
                <!-- botón de envío -->
                <input type="submit" class="btn btn-secundario btn-chico" value="Registrarse">
                
                <a href="../index.html" class="btn btn-secundario btn-chico">volver al inicio</a>
                <a href="iniciosesion.html" class="btn btn-secundario btn-chico">ya registrado? inicia sesion!</a>
                </form>
            </section>
        </main>


        <footer>
            <p>GrooveSpace - Tu lugar, tu música</p>

        </footer>
