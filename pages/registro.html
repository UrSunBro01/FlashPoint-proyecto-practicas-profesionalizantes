<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrooveSpace - Registro</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <img src="../img/logo.png" alt="GrooveSpace Logo" class="logo">
        <p>Completa tu registro</p>
        <button id="toggle-dark" class="btn-dark">🌙</button>
    </header>

    <main class="registro-container">
        <section class="login-card">
            <h2>Registro completo</h2>
            <form id="registroForm">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>

                <label for="fecha">Fecha de nacimiento:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="btn-morado">Crear cuenta</button>
            </form>
        </section>
    </main>

    <footer>
        <p>GrooveSpace - Tu lugar, tu música</p>
    </footer>

    <!-- Bottom Floating Nav cel -->
    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item" id="nav-home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <a href="mis_reservas.html" class="nav-item" id="nav-reservas">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </a>
        <a href="reservar.html" class="nav-item nav-item-center" id="nav-reservar">
            <div class="plus-btn">+</div>
        </a>
        <a href="reservar.html" class="nav-item" id="nav-salas">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </a>
        <a href="login.html" class="nav-item active" id="nav-login">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
    </nav>

    <script src="../js/script.js"></script>
    <script>
        document.getElementById("registroForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const nombre = document.getElementById("nombre").value;
            const apellido = document.getElementById("apellido").value;
            const email = document.getElementById("email").value;

            localStorage.setItem("usuario", usuario);
            localStorage.setItem("nombre", nombre);
            localStorage.setItem("apellido", apellido);
            localStorage.setItem("email", email);

            window.location.href = "../index.html";
        });
    </script>
</body>
</html>
