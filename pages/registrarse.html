<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>registro GrooveSpace</title>
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/fuentes.css">
    </head>
    <body>
        <header>
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="../iconos/logo.png" alt="Logo de GrooveSpace" class="logo-image">
                </a>
                <p class="subtitulo">Trabajo práctico · Leopoldo Marechal</p>
            </div>
            <nav>
                
            </nav>
        </header>


        <main>
            <section class="form-container">
                <h1>registro de usuario:</h1>

                    <!-- formulario de registro -->
                    <!-- hagamos de cuenta que safa -->
                <form action="procesar_registro.html" method="post">
                    <!-- usuario-->
                    <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" placeholder="nombre de usuario" minlength="4" maxlength="15"  required>
                
                <!-- email-->
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="tu correo electrónico" required>
                <!-- telefono-->
                
                <label for="phone">telefono:</label>
                <input type="tel" id="phone" name="phone" placeholder="tu número de teléfono sin cod de área" required>
                
                <!-- contraseña pide entre 4 y 15 caracteres -->
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="tu contraseña" minlength="4" maxlength="15" pattern="^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{4,15}$" title="Debe contener al menos una mayúscula y un número, entre 4 y 15 caracteres" required>
                
                <label for="confirm_password">Confirmar contraseña:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="confirma tu contraseña" minlength="4" maxlength="15" pattern="^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{4,15}$" title="Debe contener al menos una mayúscula y un número, entre 4 y 15 caracteres" required>
                
                
            

            
                <label for="cumpleaños">Fecha de nacimiento:</label>
                <input type="date" id="cumpleaños" name="cumpleaños"  required>
                
                <div class="options-group">
                <input type="checkbox" value="aceptar" required> Acepto los términos y condiciones de uso.
                </div>
                
                
                <!-- botón de envío -->
                <input type="submit" value="Registrarse">
                </form>
                <a href="index.html" class="back-home">volver al inicio</a>
            </section>
        </main>


        <footer>
            <p>el tp, alumnos, profesor, y todo es relacionado</p>
            <p>la pagina es un trademark de boys from merlo. © 2026</p>
            <p>ahreloco</p>
        </footer>

    </body>
</html>
